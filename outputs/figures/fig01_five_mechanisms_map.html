 <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.5.0.min.js" integrity="sha256-fHbNLP+GlIXN+efbQec78UkemUz3NJp7UmfGxC1tNxs=" crossorigin="anonymous"></script> <div id="355df999-4b4b-408f-a387-b0f6660928bd" class="plotly-graph-div" style="height:620px; width:100%;"></div> <script> window.PLOTLYENV=window.PLOTLYENV || {}; if (document.getElementById("355df999-4b4b-408f-a387-b0f6660928bd")) { Plotly.newPlot( "355df999-4b4b-408f-a387-b0f6660928bd", [{"hoverinfo":"skip","lat":[33.4],"lon":[-90.5],"marker":{"color":"rgba(0,0,0,0)","line":{"color":"#B5451B","width":1.5},"opacity":0.4,"size":35},"mode":"markers","showlegend":false,"type":"scattergeo"},{"hoverinfo":"skip","lat":[37.3],"lon":[-81.7],"marker":{"color":"rgba(0,0,0,0)","line":{"color":"#888888","width":1.5},"opacity":0.4,"size":35},"mode":"markers","showlegend":false,"type":"scattergeo"},{"hoverinfo":"skip","lat":[41.1],"lon":[-80.6],"marker":{"color":"rgba(0,0,0,0)","line":{"color":"#8B4513","width":1.5},"opacity":0.4,"size":35},"mode":"markers","showlegend":false,"type":"scattergeo"},{"hoverinfo":"skip","lat":[43.1],"lon":[-102.3],"marker":{"color":"rgba(0,0,0,0)","line":{"color":"#2D6A4F","width":1.5},"opacity":0.4,"size":35},"mode":"markers","showlegend":false,"type":"scattergeo"},{"hoverinfo":"skip","lat":[37.7],"lon":[-122.4],"marker":{"color":"rgba(0,0,0,0)","line":{"color":"#4a7ba7","width":1.5},"opacity":0.4,"size":35},"mode":"markers","showlegend":false,"type":"scattergeo"},{"hoverlabel":{"bgcolor":"#0d0d0d","bordercolor":"#B5451B","font":{"color":"#e8e8e8","family":"Inter, sans-serif","size":12},"namelength":0},"hovertemplate":"\u003cb\u003eMississippi Delta\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003eExcluded by design since Reconstruction\u003c\u002fi\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eThe original exclusion. The FHA and GI Bill were built with explicit\u003cbr\u003eracial exclusions baked in. The Delta is where those exclusions are\u003cbr\u003emost visible in six decades of data, and most durable. Sixty years of\u003cbr\u003ecompounded returns on an asset you were prevented from buying is the\u003cbr\u003eracial wealth gap.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eMedian income: 55% of national. Never above 65%.\u003c\u002f\u003cextra\u003e\u003c\u002fextra\u003e","lat":[33.4],"lon":[-90.5],"marker":{"color":"#B5451B","line":{"color":"#000","width":2},"opacity":0.9,"size":22,"symbol":"circle"},"mode":"markers+text","name":"Mississippi Delta","showlegend":false,"text":["Mississippi Delta"],"textfont":{"color":"#B5451B","family":"Inter, sans-serif","size":11},"textposition":"bottom center","type":"scattergeo"},{"hoverlabel":{"bgcolor":"#0d0d0d","bordercolor":"#888888","font":{"color":"#e8e8e8","family":"Inter, sans-serif","size":12},"namelength":0},"hovertemplate":"\u003cb\u003eCoal Country\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003eExtraction economy abandoned\u003c\u002fi\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eThe company town was the asset contract in miniature: the company\u003cbr\u003eowned the housing, the store, the jobs. When the coal ran out, the\u003cbr\u003ecompany left. Nothing replaced the infrastructure it took with it. The\u003cbr\u003eopioid crisis is the final chapter of economic abandonment.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eLost 81% of peak population. Income: 50% of national.\u003c\u002f\u003cextra\u003e\u003c\u002fextra\u003e","lat":[37.3],"lon":[-81.7],"marker":{"color":"#888888","line":{"color":"#000","width":2},"opacity":0.9,"size":22,"symbol":"circle"},"mode":"markers+text","name":"Coal Country","showlegend":false,"text":["Coal Country"],"textfont":{"color":"#888888","family":"Inter, sans-serif","size":11},"textposition":"bottom center","type":"scattergeo"},{"hoverlabel":{"bgcolor":"#0d0d0d","bordercolor":"#8B4513","font":{"color":"#e8e8e8","family":"Inter, sans-serif","size":12},"namelength":0},"hovertemplate":"\u003cb\u003eRust Belt\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003eManufacturing made disposable\u003c\u002fi\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eThese communities built their lives around the assumption that the\u003cbr\u003eplant would stay. Youngstown's Black Monday in 1977 and Janesville's\u003cbr\u003eGM closure in 2008 are the same story told thirty years apart. The\u003cbr\u003eplant was a social contract. When it closed, the contract ended\u003cbr\u003eovernight.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eIncome fell from 95% to 80% of national after GM closure.\u003c\u002f\u003cextra\u003e\u003c\u002fextra\u003e","lat":[41.1],"lon":[-80.6],"marker":{"color":"#8B4513","line":{"color":"#000","width":2},"opacity":0.9,"size":22,"symbol":"circle"},"mode":"markers+text","name":"Rust Belt","showlegend":false,"text":["Rust Belt"],"textfont":{"color":"#8B4513","family":"Inter, sans-serif","size":11},"textposition":"bottom center","type":"scattergeo"},{"hoverlabel":{"bgcolor":"#0d0d0d","bordercolor":"#2D6A4F","font":{"color":"#e8e8e8","family":"Inter, sans-serif","size":12},"namelength":0},"hovertemplate":"\u003cb\u003ePine Ridge\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003eNever inside the Dream\u003c\u002fi\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003ePine Ridge is not a place where the Dream failed. It is a place the\u003cbr\u003eDream never reached. The Oglala Lakota Nation is the project's\u003cbr\u003ebaseline, what complete structural exclusion from the asset\u003cbr\u003earchitecture looks like across generations. The poverty rate has never\u003cbr\u003efallen below 35%.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePoverty rate: 63%. Never below 35% in any recorded decade.\u003c\u002f\u003cextra\u003e\u003c\u002fextra\u003e","lat":[43.1],"lon":[-102.3],"marker":{"color":"#2D6A4F","line":{"color":"#000","width":2},"opacity":0.9,"size":22,"symbol":"circle"},"mode":"markers+text","name":"Pine Ridge","showlegend":false,"text":["Pine Ridge"],"textfont":{"color":"#2D6A4F","family":"Inter, sans-serif","size":11},"textposition":"bottom center","type":"scattergeo"},{"hoverlabel":{"bgcolor":"#0d0d0d","bordercolor":"#4a7ba7","font":{"color":"#e8e8e8","family":"Inter, sans-serif","size":12},"namelength":0},"hovertemplate":"\u003cb\u003eBay Area \u002f NYC\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003eWhat winning the asset economy looks like\u003c\u002fi\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eThe inverse. Where the asset contract's winners concentrate. Median\u003cbr\u003eincome has risen to 1.43x the national median, and even that cannot\u003cbr\u003eafford the local housing market. The Dream is broken here too, just in\u003cbr\u003ethe opposite direction: abundance for the credentialed few,\u003cbr\u003edisplacement for everyone else.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eIncome: 143% of national. Homeownership: 38%, lowest of five.\u003c\u002f\u003cextra\u003e\u003c\u002fextra\u003e","lat":[37.7],"lon":[-122.4],"marker":{"color":"#4a7ba7","line":{"color":"#000","width":2},"opacity":0.9,"size":22,"symbol":"circle"},"mode":"markers+text","name":"Bay Area \u002f NYC","showlegend":false,"text":["Bay Area"],"textfont":{"color":"#4a7ba7","family":"Inter, sans-serif","size":11},"textposition":"bottom center","type":"scattergeo"}], {"template":{"layout":{"colorway":["#c9a96e","#B5451B","#4a7ba7","#2D6A4F","#888888","#c94040"],"font":{"color":"#e8e8e8","family":"Inter, system-ui, sans-serif","size":12},"hoverlabel":{"bgcolor":"#111111","bordercolor":"#333333","font":{"color":"#e8e8e8","family":"Inter, system-ui","size":12}},"legend":{"bgcolor":"rgba(0,0,0,0)","bordercolor":"#2a2a2a","font":{"color":"#666666","size":11}},"margin":{"b":60,"l":70,"r":40,"t":80},"paper_bgcolor":"#0a0a0a","plot_bgcolor":"#0a0a0a","title":{"font":{"color":"#e8e8e8","family":"Georgia, serif","size":18},"pad":{"l":0,"t":10},"x":0.0,"xanchor":"left"},"xaxis":{"gridcolor":"#1a1a1a","linecolor":"#2a2a2a","tickcolor":"#666666","tickfont":{"color":"#666666","size":11},"zeroline":false},"yaxis":{"gridcolor":"#1a1a1a","linecolor":"#2a2a2a","tickcolor":"#666666","tickfont":{"color":"#666666","size":11},"zeroline":false}}},"geo":{"projection":{"type":"albers usa"},"scope":"usa","bgcolor":"#0a0a0a","landcolor":"#111111","lakecolor":"#0a0a0a","showlakes":true,"showrivers":false,"countrycolor":"#1a1a1a","coastlinecolor":"#1a1a1a","subunitcolor":"#222222","showsubunits":true,"showcoastlines":true},"paper_bgcolor":"#0a0a0a","plot_bgcolor":"#0a0a0a","title":{"font":{"family":"Georgia, serif","size":22,"color":"#e8e8e8"},"pad":{"l":20,"t":20},"text":"\u003cb\u003eFive Mechanisms of the Asset Contract\u003c\u002fb\u003e","x":0.0},"margin":{"t":80,"b":60,"l":20,"r":20},"height":620,"annotations":[{"font":{"color":"#555555","family":"Inter, sans-serif","size":11},"showarrow":false,"text":"Hover any marker to read its story. Each community embodies a distinct mechanism by which the American asset contract operates.","x":0.5,"xanchor":"center","xref":"paper","y":-0.02,"yanchor":"top","yref":"paper"}],"autosize":true}, {"responsive": true, "displayModeBar": true, "displaylogo": false, "modeBarButtonsToRemove": ["pan2d", "lasso2d", "select2d", "autoScale2d", "resetScale2d"], "toImageButtonOptions": {"format": "png", "filename": "fig01_five_mechanisms_map", "width": 1200, "height": 620, "scale": 2}} ) }; </script> </div>
